<!DOCTYPE html>
<html lang="KO">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/png" href="asset/icon/ico_32x32.png">
    <link rel="apple-touch-icon" href="asset/icon/ico_32x32.png">

    <script>
        //Useful Function
        function link(_type, _num) {
            return "./index.html?type="+(_type).toString()+"&n="+(_num).toString();
        }

        //Params Load
        const searchParams = new URLSearchParams(location.search);
        let type = parseInt(searchParams.get('type'));
        let n    = parseInt(searchParams.get('n'));

        if (Number.isNaN(type)) {
            type = 0
        }

        //Font Info Load
        let fontInfo
            fetch("asset/fontInfo.yaml")
            .then(response => response.text())
            .then(text => {
                fontInfo = jsyaml.load(text);
                init()
            });
        
        function init() {
            let i = 0
            
            if (type==0) {
                document.body.insertAdjacentHTML("beforeend",
                    "<title>qhtjr의 폰트 카탈로그</title>" +
                    "<p class='tTitle'>폰트 카탈로그</p>" +
                    "<p>제가 제작한 폰트를 모아둔 곳입니다.<br>" +
                    "제작자: qhtjr1116 <a href='https://x.com/qhtjr1116' target='_blank'>[트위터/X]</a> <a href='https://github.com/eocnd1116' target='_blank'>[깃허브]</a></p>" +
                    "<hr>"
                );
                i = 0
                while (`vol${i}` in fontInfo) {
                    if (`vol${i}` in fontInfo) {
                        //Load Vol
                        console.log(`vol${i} Load`);
                        
                        let result = `<p style="margin-bottom:10px">[${fontInfo[`vol${i}`].name}] &nbsp; <a class="tGray">
                            ${fontInfo[`vol${i}`].date}</a></p><p class="tVol">`
                        let vDir = fontInfo[`vol${i}`]

                        for(let j=0; j<vDir.list.length; j++) {
                            result += `${vDir.list[j][0]}:</div><br>`;
                            for(let k=1; k<vDir.list[j].length; k++) {
                                //Not Exist Font
                                if (!(`font${vDir.list[j][k]}` in fontInfo)) {
                                    console.log(`font${vDir.list[j][k]} Not Load`);
                                    continue
                                }

                                //Load Font in Vol
                                console.log(`font${vDir.list[j][k]} Load`);
                                let fDir = fontInfo[`font${vDir.list[j][k]}`]
                                
                                //Font-Family Create
                                document.head.insertAdjacentHTML("beforeend", `<style>@font-face { font-family: "${fDir.nameEn}"; src: url("${fDir.ttfDir}") format("truetype"); font-weight: normal; }</style>`);
                                
                                //Push Result
                                result += ">&nbsp;<a href='" + link(fDir.goto[0],fDir.goto[1]) +
                                    `' class='moveLink' style='font-family:"${fDir.nameEn}",serif;font-size:${fDir.size*2}pt;line-height:1.2'>
                                    ${fDir.nameKr}</a><br>`;
                            }
                            result += "<br>"
                        }
                        result += "</p>"
                        document.body.insertAdjacentHTML("beforeend", result)
                    } else {
                    }
                    i++;
                }
            } else if (type==1) {
                document.body.insertAdjacentHTML("beforeend", "<p><a href='"+link(0,0)+"'>다른 폰트 구경하기</a></p><br>")

                //Font Load
                if (!(`font${n}` in fontInfo)) {
                    document.body.insertAdjacentHTML("beforeend", "<p>여긴 어딘가요?</p>")
                    return
                }
                let fDir = fontInfo[`font${n}`]

                //Font-Family Create
                document.head.insertAdjacentHTML("beforeend", `
                    <style>
                    @font-face {
                        font-family: "${fDir.nameEn}";
                        src: url("${fDir.ttfDir}") format("truetype");
                        font-weight: normal;
                    }
                    </style>
                `);
                
                let range = ""
                for (let i=0; i<fDir.range.length;i++) {
                    if (`range${fDir.range[i]}` in fontInfo) {
                        let rDir = fontInfo[`range${fDir.range[i]}`]
                        if (range !== "") {
                            range += "&nbsp;".repeat(12)
                        }
                        range += `<img src="${rDir.icoDir}" style="vertical-align: -2px;">${rDir.name}<br>`
                    }
                }

                let tool = ""
                for (let i=0; i<fDir.tool.length;i++) {
                    let tDir = fDir.tool[i]
                    tool += `<br>${i}. <a href="${tDir[0]}" target='_blank'>${tDir[1]}</a> by ${tDir[2]}`
                }

                let patch = ""
                for (let i=0; i<fDir.patch.length;i++) {
                    let hDir = fDir.patch[i]
                    if (patch !== "") {
                        patch += "<br>"
                    }
                    patch += ` &nbsp; ${hDir[0]} &nbsp; ${hDir[1]}`
                }

                document.body.insertAdjacentHTML("beforeend", `<title>qhtjr의 폰트 카탈로그 - ${fDir.nameKr}.ttf</title>` +
                `<p class='tTitle' style='font-family:"${fDir.nameEn}",serif;font-size:${fDir.size*4}pt;'>${fDir.nameKr}</p><p style='font-family:"${fDir.nameEn}",serif;font-size:${fDir.size*2}pt;margin-top:0px'>${fDir.info}<br>` +
                `<p class='tDtail'>폰트 사이즈: ${fDir.size}pt(${fDir.sizePx}px)의 배수<br>지원 범위:${range}제작자: ${fDir.creator}</a><hr><br>` +
                
                `<p style='font-family:"${fDir.nameEn}",serif;font-size:${fDir.size*2}pt; margin-top:20px'><textarea cols=\"50\" rows=\"5\" autofocus=\"\" style=\"margin-left: 32px;margin-bottom: 40px;padding-left: 10px;padding-top: 10px;font-size:${fDir.size*2}pt;\">${fDir.pangram}</textarea>` +
                `<br><a href="${fDir.ttfDir}" download>[TTF 파일 다운로드]</a>` +
                `</p><p style='font-family:"${fDir.nameEn}",serif;font-size:${fDir.size*2}pt; margin-bottom:0px'>수정 내역</p>` +
                `<p style="margin-top:0px" class=tGray>` +
                patch + '</p>' +

                `<hr><p class='tTitle' style='font-family:"${fDir.nameEn}",serif;font-size:${fDir.size*2}pt;'>라이선스</p>` +
                "<table><td align ='left'><p>범주</p></td><td align ='left'><p>여부 및 설명</p></td>" +
                "<tr><td style='vertical-align:top;padding-right: 50px;width:20%'><p>상업적 이용</p></td><td><p class='tYes'>O 가능<br><p class='tGray'>해당 폰트는 상업적 이용이 가능합니다.</br>표현하는 내용/매체는 상관치 않습니다.</p></p></td></tr>" +
                "<tr><td style='vertical-align:top;padding-right: 50px;width:20%'><p>임베드</p></td><td><p class='tYes'>O 가능<br><p class='tGray'>폰트 파일을 문서/게임/소프트웨어 등에 포함시키거나 웹 폰트로 이용할 수 있습니다.</p></p></td></tr>" +
                "<tr><td style='vertical-align:top;padding-right: 50px;width:20%'><p>출처 표기</p></td><td><p class='tYes'>O 필수 아님<br><p class='tGray'>폰트의 그 출처/이름/저작자는 표기하지 않아도 됩니다.<br>(필수는 아니지만, qhtjrx@gmail.com으로 한번 연락주시면 기쁩니다.)</p></p></td></tr>" +
                "<tr><td style='vertical-align:top;padding-right: 50px;width:20%'><p>수정 및 재배포</p></td><td><p class='tYes'>O 가능<br><p class='tGray'>폰트를 수정 후 재배포할 수 있습니다.<br>만일 그러할 경우 OFL-1.1을 채택해야 합니다.</p></p></td></tr>" +
                "<tr><td style='vertical-align:top;padding-right: 50px;width:20%'><p>단독 판매</p></td><td><p class='tNo'>X 금지<br><p class='tGray'>폰트 파일을 단독으로 유료 판매하는 경우에 해당하며,<br>임베드 범주의 경우는 그러하지 않습니다.</p></p></td></tr>" +
                "<tr><td style='vertical-align:top;padding-right: 50px;width:20%'><p>이용으로 인한 피해</p></td><td><p class='tNo'>X 책임지지 않음<br><p class='tGray'>폰트의 이용으로 인한 피해나 손해가 생기더라도 일절 책임지지 않습니다.</p></p></td></tr>" +
                "</table></a>" +

                `<hr><p class='tTitle' style='font-family:"${fDir.nameEn}",serif;font-size:${fDir.size*2}pt;'>사용한 도구` +
                "<p style='margin-left:24px'>아래 훌륭한 도구가 있었기에 작업을 편리하게 할 수 있었습니다.<br>감사의 말씀 드립니다." +
                tool + "</p></p>" +

                "<br><br>")
            }
        }
    </script>
</head>
</html>
